[project]
name = "riffroom-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",
  "basic-pitch[onnx]>=0.4.0",
  "setuptools<81",
  "scikit-learn==1.5.1",
  "demucs>=4.1.0",
  "numpy<2",
  "opencv-python-headless>=4.11.0.86",
  "mediapipe>=1.2.3",
  "torch>=2.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision>=0.29.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers==5.20.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "pillow>=13.0.0",
  "librosa>=0.11.0",
  "google-genai>=3.6.1",
  "python-dotenv>=1.2.4",
]

[tool.uv]
package = false
